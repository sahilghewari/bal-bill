apiVersion: apps/v1
kind: Deployment
metadata:
  name: telecom-billing-backend
  labels:
    app: telecom-billing
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: telecom-billing
      component: backend
  template:
    metadata:
      labels:
        app: telecom-billing
        component: backend
    spec:
      containers:
        - name: backend
          image: telecom-billing-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: telecom-billing-config
                  key: db-host
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: telecom-billing-config
                  key: db-port
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: telecom-billing-config
                  key: db-name
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: telecom-billing-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: telecom-billing-secrets
                  key: db-password
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: telecom-billing-secrets
                  key: stripe-secret-key
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: telecom-billing-config
                  key: cors-origin
            - name: LOG_LEVEL
              value: "info"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: telecom-billing-backend
  labels:
    app: telecom-billing
    component: backend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 5000
      protocol: TCP
      name: http
  selector:
    app: telecom-billing
    component: backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: telecom-billing-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: telecom-billing-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
